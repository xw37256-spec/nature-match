      {title:'如果要拍一张周末照片，你会拍？',note:'你会留下哪一个瞬间？',options:[['天空、海面和自己的影子', ['sea','forest']],['街边招牌、路人和一杯咖啡', ['city','food']],['桌上的早餐、书和窗边植物', ['home','ritual']],['一桌人碰杯、笑到模糊的画面', ['friends','food']]]},
      {title:'周日晚上，你最想带着什么结束？',note:'周末的最后一格，会影响下一周的开头。',options:[['身体松下来，脑子里有一点风', ['sea','forest']],['新鲜见闻，想把下周也过得有趣', ['city','create']],['干净的房间和准备好的生活用品', ['home','ritual']],['和喜欢的人聊完天，心里热乎乎的', ['friends','food']]]},
      {title:'你最不能接受的周末安排是？',note:'不适合你的，也值得被看见。',options:[['密不透风的景点打卡', ['sea','forest']],['两天都没有任何新鲜感', ['city','food']],['被迫社交、家务和工作混在一起', ['home','create']],['一个人从早到晚都没有说话', ['friends','food']]]},
      {title:'理想周末结束后，你希望自己？',note:'你想从周末带走哪种感觉？',options:[['像被自然重新充满电', ['sea','forest']],['多了几个灵感和故事', ['city','create']],['觉得生活重新变得可控、舒服', ['home','ritual']],['和人有连接，心情亮起来', ['friends','food']]]},
      {title:'如果周末只能保留一个关键词？',note:'选一个你现在最缺的东西。',options:[['风', ['sea','forest']],['新鲜', ['city','food']],['安稳', ['home','ritual']],['连接', ['friends','create']]]},
      {title:'你愿意在下周继续保留哪件小事？',note:'好的周末，不只发生在周末。',options:[['每天走一小段有风的路', ['sea','forest']],['每周去一个没去过的地方', ['city','food']],['固定整理一个让自己舒服的角落', ['home','ritual']],['留时间给朋友，也留时间给自己的作品', ['friends','create']] ]}
    ];
    const state={index:0,answers:[],selected:null};const intro=document.getElementById('intro'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),questionView=document.getElementById('question-view'),resultView=document.getElementById('result-view'),toast=document.getElementById('toast');
    function showScreen(screen){[intro,quiz,result].forEach(s=>s.classList.toggle('hidden',s!==screen));window.scrollTo({top:0,behavior:'smooth'})}
    function renderQuestion(){const q=questions[state.index],percent=Math.round((state.index+1)/questions.length*100);document.getElementById('progress-label').textContent=`第 ${state.index+1} / ${questions.length} 题`;document.getElementById('progress-percent').textContent=`${percent}%`;document.getElementById('fill').style.width=`${percent}%`;questionView.className='fade';questionView.innerHTML=`<div class="kicker">QUESTION ${String(state.index+1).padStart(2,'0')}</div><h2 class="question">${q.title}</h2><p class="note">${q.note}</p><div class="options" role="radiogroup" aria-label="${q.title}">${q.options.map((o,i)=>`<button class="option ${state.selected===i?'selected':''}" data-option="${i}" type="button" role="radio" aria-checked="${state.selected===i}"><span class="mark">✓</span><span class="option-text">${o[0]}</span></button>`).join('')}</div><div class="quiz-footer"><button class="back" id="back" type="button" ${state.index===0?'style="visibility:hidden"':''}>← 上一题</button><button class="primary" id="next" type="button" ${state.selected===null?'disabled':''}>${state.index===questions.length-1?'查看我的理想周末 →':'下一题 →'}</button></div>`;questionView.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{state.selected=Number(btn.dataset.option);renderQuestion()}));document.getElementById('back').addEventListener('click',()=>{if(state.index>0){state.index--;state.selected=state.answers[state.index]??null;renderQuestion()}});document.getElementById('next').addEventListener('click',()=>{if(state.selected===null)return;state.answers[state.index]=state.selected;if(state.index===questions.length-1)renderResult();else{state.index++;state.selected=state.answers[state.index]??null;renderQuestion()}})}
    function findWeekend(){const scores={sea:0,city:0,forest:0,home:0,friends:0,create:0,food:0,ritual:0};state.answers.forEach((answer,i)=>questions[i].options[answer][1].forEach(id=>scores[id]++));const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const id=ranked[0][0];return{id,weekend:types[id],score:Math.round(78+ranked[0][1]/questions.length*20),scores}}
    function renderResult(){const match=findWeekend(),w=match.weekend;resultView.className='fade';resultView.innerHTML=`<article class="card" id="share-card"><div class="result-head"><div class="type-icon">${w.emoji}</div><div><div class="result-label">你的理想周末是</div><h1 class="result-name">${w.name}</h1><div class="result-sub">${w.tag}</div><span class="score">生活节奏匹配度 ${match.score}%</span></div></div><p class="quote">“${w.quote}”</p><div class="section-title">你的周末安排</div><div class="schedule"><div class="slot"><b>上午</b><span>${w.morning}</span></div><div class="slot"><b>下午</b><span>${w.afternoon}</span></div><div class="slot"><b>晚上</b><span>${w.evening}</span></div></div><div class="section-title">不太适合你的安排</div><div class="tips">${w.avoid}</div><div class="section-title">未来 7 天的小行动</div><div class="action">${w.action}</div><div class="paywall"><b>想要更完整的周末报告？</b><p>完整版会解锁专属配色、周末清单、可打印计划和手机壁纸。当前先把这张结果卡保存下来，等你准备好再继续。</p><button class="secondary" id="paid-btn" type="button">查看完整报告内容</button></div><p class="footnote">这是一份基于生活偏好的轻测试，不替代心理诊断。它只是帮你找到一种更适合自己的休息方式。</p></article><div class="actions"><button class="primary" id="copy-btn" type="button">复制结果文案</button><button class="primary" id="save-btn" type="button">保存周末卡</button><button class="secondary" id="restart" type="button">重新测试</button></div>`;document.getElementById('copy-btn').addEventListener('click',()=>copyResult(w,match.score));document.getElementById('save-btn').addEventListener('click',()=>saveResultImage(w,match.score));document.getElementById('restart').addEventListener('click',restart);document.getElementById('paid-btn').addEventListener('click',()=>showToast('完整版入口可以接入小红书店铺或你的支付链接'));showScreen(result)}
    async function copyResult(w,score){const text=`我的理想周末是「${w.name}」｜${w.tag}\n生活节奏匹配度 ${score}%\n\n${w.quote}\n\n上午：${w.morning}\n下午：${w.afternoon}\n晚上：${w.evening}\n\n未来 7 天的小行动：${w.action}\n\n#理想周末 #生活方式测试 #周末怎么过`;try{await navigator.clipboard.writeText(text);showToast('结果文案已复制，可以发小红书了 ✨')}catch{showToast('复制失败，可以直接截图保存')}}
    function round(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r)}ctx.closePath()}
    function wrap(ctx,text,x,y,max,line,maxLines=99){let current='',count=0;for(const ch of String(text)){const next=current+ch;if(ctx.measureText(next).width>max&&current){ctx.fillText(current,x,y);y+=line;count++;current=ch;if(count>=maxLines-1){current+='…';break}}else current=next}if(current&&count<maxLines){ctx.fillText(current,x,y);y+=line}return y}
    function makeImage(w,score){const c=document.createElement('canvas');c.width=1080;c.height=1440;const ctx=c.getContext('2d'),g=ctx.createLinearGradient(0,0,1080,1440);g.addColorStop(0,w.colors[0]);g.addColorStop(.55,'#fff7ef');g.addColorStop(1,w.colors[1]);ctx.fillStyle=g;ctx.fillRect(0,0,1080,1440);ctx.globalAlpha=.28;ctx.fillStyle=w.colors[2];ctx.beginPath();ctx.arc(930,190,190,0,Math.PI*2);ctx.fill();ctx.fillStyle='#78998c';ctx.beginPath();ctx.arc(50,1240,210,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='rgba(255,253,249,.96)';round(ctx,55,55,970,1330,42);ctx.fill();ctx.fillStyle='#527467';ctx.font='700 22px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('生活方式研究所',100,120);ctx.fillStyle='#a4aea7';ctx.font='700 18px system-ui,sans-serif';ctx.fillText('WEEKEND MATCH / 08',745,120);ctx.strokeStyle='#e8ded3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(100,157);ctx.lineTo(980,157);ctx.stroke();ctx.fillStyle='#d88972';ctx.font='700 22px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('你的理想周末是',100,226);ctx.fillStyle='#2d3834';ctx.font='700 73px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText(w.name,100,323);ctx.fillStyle='#84908a';ctx.font='500 27px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText(w.tag,102,370);ctx.fillStyle='#e5efe8';round(ctx,100,404,250,54,27);ctx.fill();ctx.fillStyle='#527467';ctx.font='700 22px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText(`生活节奏匹配度 ${score}%`,124,439);ctx.fillStyle='#3b4841';ctx.font='600 30px "PingFang SC","Microsoft YaHei",sans-serif';let y=wrap(ctx,`“${w.quote}”`,100,525,880,48,3)+30;ctx.fillStyle='#d88972';ctx.font='700 19px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('上午',100,y);ctx.fillText('下午',400,y);ctx.fillText('晚上',700,y);y+=38;ctx.fillStyle='#2d3834';ctx.font='500 21px "PingFang SC","Microsoft YaHei",sans-serif';wrap(ctx,w.morning,100,y,230,32,4);wrap(ctx,w.afternoon,400,y,230,32,4);wrap(ctx,w.evening,700,y,230,32,4);y+=170;ctx.strokeStyle='#e8ded3';ctx.beginPath();ctx.moveTo(100,y);ctx.lineTo(980,y);ctx.stroke();y+=52;ctx.fillStyle='#d88972';ctx.font='700 19px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('不太适合你的安排',100,y);y+=36;ctx.fillStyle='#53655a';ctx.font='500 22px "PingFang SC","Microsoft YaHei",sans-serif';y=wrap(ctx,w.avoid,100,y,880,36,3)+28;ctx.fillStyle='#d88972';ctx.font='700 19px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('未来 7 天的小行动',100,y);y+=36;ctx.fillStyle='#855d4e';ctx.font='500 22px "PingFang SC","Microsoft YaHei",sans-serif';wrap(ctx,w.action,100,y,880,36,3);ctx.fillStyle='#9a9c91';ctx.font='500 18px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText('#理想周末  #生活方式测试',100,1328);return c}
    async function saveResultImage(w,score){const canvas=makeImage(w,score);canvas.toBlob(async blob=>{if(!blob){showToast('图片生成失败，请稍后再试');return}const fileName=`理想周末-${w.name}.png`,file=new File([blob],fileName,{type:'image/png'});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:`我的理想周末是${w.name}`,text:'测测你的理想周末',files:[file]});showToast('请在分享面板中选择“存储图像”')}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;const preview=window.open(url,'_blank');if(!preview)a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);showToast('结果图已生成，请长按图片保存到相册')}}catch(error){if(error.name!=='AbortError')showToast('请长按生成的图片，选择保存到相册')}},'image/png')}
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2600)}function restart(){state.index=0;state.answers=[];state.selected=null;showScreen(intro)}document.getElementById('start').addEventListener('click',()=>{state.index=0;state.answers=[];state.selected=null;showScreen(quiz);renderQuestion()});
