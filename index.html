<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1ea" />
  <meta name="description" content="15 道生活方式问题，测测与你气质最合拍的本命自然物。" />
  <title>测测你的本命自然物</title>
  <link rel="preload" as="image" href="assets/nature-still-life-hero.jpg" fetchpriority="high" />
  <style>
    :root {
      --paper: #f6f2eb;
      --paper-2: #fcfaf6;
      --ink: #27322f;
      --muted: #7e8780;
      --line: #e8e2d9;
      --sage: #7e9b8e;
      --sage-deep: #56776a;
      --coral: #d88770;
      --coral-soft: #f4ddd4;
      --blue: #91a9b6;
      --lavender: #b7b4c8;
      --shadow: 0 20px 60px rgba(81, 82, 68, .10);
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--paper); }
    button { font: inherit; }
    .app-shell { min-height: 100svh; padding: 18px 16px 30px; overflow: hidden; position: relative; background-color: #dce8dc; background-image: linear-gradient(180deg, rgba(255,250,242,.72) 0%, rgba(255,250,242,.43) 42%, rgba(244,239,227,.72) 100%), url("assets/nature-still-life-hero.jpg"); background-size: cover; background-position: center 42%; background-attachment: scroll; }
    .app-shell::before { content: ""; position: fixed; width: 220px; height: 220px; border-radius: 50%; background: rgba(145,169,182,.10); left: -130px; top: 80px; filter: blur(2px); pointer-events: none; }
    .app-shell::after { content: ""; position: fixed; width: 180px; height: 180px; border-radius: 50%; background: rgba(216,135,112,.08); right: -100px; bottom: 10%; pointer-events: none; }
    .topbar { max-width: 980px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; letter-spacing: .08em; position: relative; z-index: 2; }
    .brand { display: flex; gap: 9px; align-items: center; color: var(--ink); font-weight: 700; letter-spacing: .14em; }
    .brand-dot { width: 10px; height: 10px; display: inline-block; border-radius: 50% 50% 50% 0; background: var(--coral); transform: rotate(-45deg); }
    .screen { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }
    .screen.hidden { display: none; }
    .hero { min-height: calc(100svh - 86px); display: flex; flex-direction: column; justify-content: center; padding: 28px 0 18px; }
    .eyebrow { color: var(--sage-deep); font-size: 12px; font-weight: 800; letter-spacing: .16em; margin-bottom: 16px; }
    h1, h2, p { margin-top: 0; }
    h1 { font-size: clamp(38px, 10vw, 72px); line-height: 1.08; letter-spacing: -.08em; margin-bottom: 20px; max-width: 620px; text-shadow: 0 2px 18px rgba(255,250,240,.48); }
    .hero-copy { color: #53635a; line-height: 1.9; font-size: 15px; max-width: 510px; margin-bottom: 30px; padding: 12px 14px; background: rgba(255,251,245,.58); border: 1px solid rgba(255,255,255,.48); border-radius: 16px; backdrop-filter: blur(5px); box-shadow: 0 10px 30px rgba(69,76,63,.06); }
    .hero-art { display: none; }
    .hero-art::before { content: ""; position: absolute; inset: 13px; border: 1px solid rgba(86,119,106,.18); border-radius: 22px; pointer-events: none; z-index: 2; }
    .hero-illustration { display: none; }
    .art-note { position: absolute; left: 22px; top: 20px; z-index: 3; color: #58776a; background: rgba(255,250,239,.72); padding: 6px 9px; border-radius: 999px; font-size: 10px; letter-spacing: .12em; font-weight: 800; backdrop-filter: blur(6px); }
    .art-stamp { position: absolute; right: 22px; bottom: 19px; z-index: 3; transform: rotate(5deg); color: #fffdf7; background: rgba(105,81,61,.82); padding: 8px 12px; border-radius: 16px 16px 4px 16px; font-size: 12px; font-weight: 700; box-shadow: 0 6px 14px rgba(89,65,46,.18); }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
    .pill { display: inline-flex; align-items: center; padding: 7px 11px; border: 1px solid rgba(126,155,142,.35); border-radius: 999px; background: rgba(255,255,255,.4); color: var(--sage-deep); font-size: 12px; }
    .primary-btn, .ghost-btn { border: 0; border-radius: 999px; padding: 14px 22px; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
    .primary-btn { background: var(--ink); color: #fff; box-shadow: 0 10px 24px rgba(39,50,47,.16); }
    .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(39,50,47,.20); }
    .primary-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
    .ghost-btn { color: var(--sage-deep); background: #fffdf9; border: 1px solid var(--line); }
    .quiz-wrap { padding-top: 36px; }
    .progress-row { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .progress-track { height: 5px; background: #e7e2da; border-radius: 99px; overflow: hidden; margin-bottom: 38px; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--sage), var(--coral)); transition: width .4s ease; }
    .question-kicker { color: var(--coral); font-size: 13px; font-weight: 800; letter-spacing: .12em; margin-bottom: 14px; }
    .question-title { font-size: clamp(26px, 7vw, 42px); letter-spacing: -.06em; line-height: 1.25; margin-bottom: 12px; }
    .question-note { color: var(--muted); font-size: 13px; margin-bottom: 26px; }
    .options { display: grid; gap: 12px; }
    .option { border: 1px solid var(--line); background: rgba(255,253,249,.78); border-radius: 18px; padding: 17px 18px; display: flex; gap: 13px; align-items: center; text-align: left; cursor: pointer; color: var(--ink); transition: .2s ease; min-height: 64px; }
    .option:hover { border-color: var(--sage); transform: translateX(2px); }
    .option.selected { border-color: var(--sage-deep); background: #e7efe9; box-shadow: 0 6px 16px rgba(86,119,106,.10); }
    .option-mark { width: 27px; height: 27px; flex: 0 0 27px; border: 1px solid #c9d2cc; border-radius: 50%; display: grid; place-items: center; color: transparent; font-size: 13px; font-weight: 800; }
    .selected .option-mark { color: #fff; background: var(--sage-deep); border-color: var(--sage-deep); }
    .option-text { font-size: 15px; line-height: 1.5; }
    .quiz-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 30px; padding-bottom: 30px; }
    .back-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 12px 0; }
    .result-wrap { padding: 36px 0; }
    .result-card { background: #fffdf9; border: 1px solid #ece5db; border-radius: 28px; padding: 22px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
    .result-card::before { content: "NATURE MATCH"; position: absolute; right: 18px; top: 18px; font-size: 10px; letter-spacing: .16em; color: #b7b8ad; }
    .result-top { display: flex; gap: 18px; align-items: flex-start; padding: 38px 0 22px; }
    .city-stamp { width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; font-size: 35px; background: var(--coral-soft); flex: 0 0 auto; }
    .result-label { color: var(--coral); font-size: 12px; font-weight: 800; letter-spacing: .1em; margin-bottom: 7px; }
    .result-city { font-size: clamp(33px, 10vw, 56px); line-height: 1; letter-spacing: -.08em; margin-bottom: 8px; }
    .result-country { color: var(--muted); font-size: 13px; }
    .score-chip { display: inline-flex; color: var(--sage-deep); background: #e5efe8; border-radius: 99px; padding: 7px 11px; font-size: 12px; margin-top: 14px; }
    .nature-banner { display: flex; align-items: center; gap: 13px; padding: 14px; margin: 2px 0 20px; background: #f0ebe3; border-radius: 18px; border: 1px dashed #d9d1c5; }
    .nature-emoji { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 14px; display: grid; place-items: center; background: #e4ece4; font-size: 24px; }
    .nature-label { color: var(--coral); font-size: 11px; font-weight: 800; letter-spacing: .08em; margin-bottom: 3px; }
    .nature-name { font-size: 21px; font-weight: 800; letter-spacing: -.05em; display: inline-block; margin-right: 5px; }
    .nature-type { color: #7e8278; font-size: 12px; line-height: 1.55; }
    .quote { font-size: 18px; line-height: 1.65; letter-spacing: -.03em; margin: 0 0 20px; color: #39443f; }
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 16px 0 22px; }
    .mini-card { background: #f5f1eb; border-radius: 16px; padding: 14px 12px; min-height: 108px; }
    .mini-label { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
    .mini-value { font-size: 13px; font-weight: 700; line-height: 1.55; }
    .result-copy { color: #68736c; line-height: 1.85; font-size: 14px; margin-bottom: 0; }
    .result-note { color: #9a9c91; font-size: 11px; line-height: 1.6; margin: 18px 0 0; }
    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 10px; }
    .result-actions .primary-btn, .result-actions .ghost-btn { flex: 1; min-width: 140px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); padding: 11px 16px; background: rgba(39,50,47,.94); color: #fff; border-radius: 999px; font-size: 12px; opacity: 0; pointer-events: none; transition: .25s ease; z-index: 20; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .fade-in { animation: fadeIn .38s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-width: 700px) {
      .app-shell { padding-left: 32px; padding-right: 32px; }
      .hero-art { height: 260px; }
      .hero { padding-top: 44px; }
      .result-card { padding: 32px; }
    }
    @media (max-width: 420px) {
      .result-grid { grid-template-columns: 1fr; }
      .mini-card { min-height: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .mini-label { margin-bottom: 0; }
      .result-top { gap: 13px; }
      .city-stamp { width: 64px; height: 64px; font-size: 29px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>生活方式研究所</span></div>
      <span id="top-meta">15 QUESTIONS · 50 NATURES</span>
    </header>

    <section id="intro-screen" class="screen hero fade-in">
      <div class="eyebrow">NATURE MATCH / 01</div>
      <h1>测测你的<br><span style="color:var(--sage-deep)">本命自然物</span></h1>
      <p class="hero-copy">不测星座，不讲玄学。用 15 道关于天气、节奏、吃饭和生活感受的小问题，找到一件和你日常气质很像的自然物。</p>
      <div class="hero-art" aria-label="自然与生活感手绘插画：山丘、树木、房子、咖啡和植物">
        <span class="art-note">A LITTLE MORE NATURE</span>
        <svg class="hero-illustration" viewBox="0 0 720 260" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
          <rect width="720" height="260" fill="#e7eee8"/>
          <circle cx="548" cy="59" r="31" fill="#e5b28e"/>
          <circle cx="548" cy="59" r="46" fill="none" stroke="#e5b28e" stroke-opacity=".25" stroke-width="10"/>
          <path d="M62 83c14-23 44-26 61-6 17-18 52-10 55 17 18 1 27 12 27 24H55c-6-16-1-28 7-35Z" fill="#fff8ef" fill-opacity=".8"/>
          <path d="M-22 192c88-62 151-67 218-24 62-53 150-45 213-1 67-42 149-42 333 17v76H-22Z" fill="#b7cbb9"/>
          <path d="M-15 225c93-51 180-32 246-2 82-47 168-42 239-2 77-48 158-34 271 18v45H-15Z" fill="#78988a"/>
          <g fill="#668879">
            <path d="M93 182h8l3-46-25 25 20-6-25-17 31 6 1-31 9 33 25-16-17 25 24 5-31 8 8 14H93Z"/>
            <path d="M642 190h8l2-57-27 29 22-8-28-18 34 7 1-34 9 36 25-17-17 25 24 5-30 9 8 23h-31Z"/>
          </g>
          <g transform="translate(354 113)">
            <path d="M-13 28 53-6l68 34v61H-13Z" fill="#f8f3e9" stroke="#58786b" stroke-width="2"/>

            <path d="M0 50h80"/><path d="M10 50v27m60-27v27"/><path d="M21 50V23h38v27" fill="#f8f3e9"/>
            <path d="M25 22V6m0 7c-13-8-19-1-17 7 8 2 14-1 17-7Zm0 3c13-8 19-1 17 7-8 2-14-1-17-7Z" fill="#7e9b8e"/>

        <span class="art-stamp">先把日子过舒服</span>
      </div>
      <div class="pills"><span class="pill">生活方式向</span><span class="pill">一题一页</span><span class="pill">50 种自然物</span></div>
      <button id="start-btn" class="primary-btn" type="button">开始测试 <span aria-hidden="true">→</span></button>
    </section>

    <section id="quiz-screen" class="screen quiz-wrap hidden" aria-live="polite">
      <div class="progress-row"><span id="progress-label">第 1 / 15 题</span><span id="progress-percent">7%</span></div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill" style="width:7%"></div></div>
      <div id="question-view" class="fade-in"></div>
    </section>

    <section id="result-screen" class="screen result-wrap hidden" aria-live="polite">
      <div class="eyebrow">YOUR NATURE MATCH / 50</div>
      <div id="result-view" class="fade-in"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script>
    const questions = [
      { title: "如果可以自己调天气，你会选？", note: "一年里，什么样的空气让你最放松？", options: [
        ["阳光多一点，冬天也别太长", [1, .35, .1, .05, .25, .1, .25, .2]], ["四季分明，春秋要有存在感", [.45, .5, .2, .2, .2, .15, .2, .45]], ["凉快一点，偶尔下雨也没关系", [.15, .25, .45, .3, .25, .1, .25, .3]], ["干爽清冽，冷一点反而舒服", [.05, .25, .15, .35, .15, .1, .2, .25]]
      ]},
      { title: "你理想中的通勤节奏是？", note: "把时间留给自己，也是宜居感的一部分。", options: [
        ["地铁/步行半小时内，效率优先", [.2, 1, .05, .1, .05, .7, .1, .35]], ["慢一点没关系，沿路能看到风景", [.45, .2, .45, .45, .4, .2, .4, .25]], ["最好弹性上班，别被早高峰追着跑", [.4, .15, .55, .3, .25, .35, .35, .25]], ["我能接受开车或骑车，距离不是问题", [.4, .35, .2, .25, .35, .25, .35, .2]]
      ]},
      { title: "下班后的你，更想去哪儿？", note: "好的日子，不止写字楼那一块。", options: [
        ["找一家小店坐下，喝咖啡看人来人往", [.25, .45, .15, .15, .1, .4, .25, .65]], ["去公园、江边或山里走走", [.45, .15, .65, .8, .7, .15, .4, .3]], ["逛展、看电影、听现场，文化活动不能少", [.2, .5, .2, .25, .15, .45, .15, .9]], ["回家安静待着，外卖和一部剧就很好", [.25, .1, .9, .1, .1, .25, .45, .25]]
      ]},
      { title: "对你来说，好吃最重要的是？", note: "口味是很具体的生活投票。", options: [
        ["辣和香，夜宵摊是城市的灵魂", [.45, .45, .1, .1, .15, .35, .35, .75]], ["清淡鲜甜，时令蔬菜和一碗好汤", [.3, .2, .3, .25, .3, .25, .35, .55]], ["海鲜、米粉、烧烤，地方味要够鲜明", [.45, .3, .2, .2, .55, .25, .3, .7]], ["面包、奶酪、咖啡，简单但有品质", [.25, .35, .25, .2, .1, .4, .1, .65]]
      ]},
      { title: "如果生活的地方有点潮湿，你会？", note: "不评判，按你真实的体感来选。", options: [
        ["不太行，衣服晒不干会让我崩溃", [.25, .2, .2, .65, .1, .15, .25, .2]], ["可以接受，开空调除湿就好", [.5, .3, .25, .3, .25, .25, .25, .35]], ["喜欢，雨天和绿植让我觉得有生命力", [.55, .15, .55, .1, .45, .15, .35, .3]], ["偶尔可以，长期还是想要干爽", [.3, .25, .25, .45, .2, .2, .3, .25]]
      ]},
      { title: "你和热闹的关系是？", note: "你需要的是能量，还是留白？", options: [
        ["越热闹越有劲，夜生活别太早结束", [.4, .6, .05, .05, .1, .55, .15, .7]], ["白天热闹、晚上安静，平衡最重要", [.35, .4, .3, .25, .2, .4, .2, .5]], ["安静是刚需，最好邻居都轻一点", [.25, .1, 1, .3, .25, .15, .45, .2]], ["人少一点没事，但公共空间要有温度", [.3, .2, .65, .45, .35, .2, .4, .35]]
      ]},
      { title: "关于收入和生活成本，你更在意？", note: "不设标准答案，只看你现在的阶段。", options: [
        ["机会多一点，忙一点也能接受", [.25, .65, .1, .1, .1, 1, .05, .6]], ["房租别太夸张，舒服和性价比更重要", [.35, .25, .35, .3, .2, .25, 1, .35]], ["收入稳定，公共服务靠谱就很安心", [.25, .2, .25, .3, .15, .5, .45, .55]], ["愿意为审美、自然和松弛感多花一点", [.45, .2, .3, .55, .55, .25, .1, .6]]
      ]},
      { title: "你最喜欢哪个季节？", note: "季节感，会默默决定你的幸福感。", options: [
        ["春天：风一吹，整个人就想出门", [.5, .2, .25, .35, .25, .15, .25, .35]], ["夏天：晒太阳、游泳、吃冰的快乐", [1, .4, .2, .15, .6, .2, .3, .35]], ["秋天：空气清爽，走路都很有质感", [.2, .25, .3, .4, .2, .2, .3, .55]], ["冬天：窝在室内，生活有边界感", [.05, .2, .65, .25, .1, .25, .35, .45]]
      ]},
      { title: "你希望身边的人是什么样？", note: "包容度，常常比热闹更重要。", options: [
        ["大家直来直往，效率高，不用猜", [.2, .6, .15, .05, .1, .5, .2, .35]], ["不同背景的人都能自在生活", [.35, .35, .2, .2, .15, .45, .2, 1]], ["邻里熟一点，关键时刻能互相照应", [.35, .15, .35, .3, .2, .2, .35, .4]], ["保持距离感，互不打扰就是尊重", [.25, .2, .75, .25, .1, .2, .4, .45]]

      const q = questions[state.index];
      const percent = Math.round(((state.index + 1) / questions.length) * 100);
      document.getElementById('progress-label').textContent = `第 ${state.index + 1} / ${questions.length} 题`;
      document.getElementById('progress-percent').textContent = `${percent}%`;
      document.getElementById('progress-fill').style.width = `${percent}%`;
      questionView.className = 'fade-in';
      questionView.innerHTML = `<div class="question-kicker">QUESTION ${String(state.index + 1).padStart(2, '0')}</div><h2 class="question-title">${q.title}</h2><p class="question-note">${q.note}</p><div class="options" role="radiogroup" aria-label="${q.title}">${q.options.map((option, i) => `<button class="option ${state.selected === i ? 'selected' : ''}" data-option="${i}" type="button" role="radio" aria-checked="${state.selected === i}"><span class="option-mark">✓</span><span class="option-text">${option[0]}</span></button>`).join('')}</div><div class="quiz-footer"><button class="back-btn" id="back-btn" type="button" ${state.index === 0 ? 'style="visibility:hidden"' : ''}>← 上一题</button><button class="primary-btn" id="next-btn" type="button" ${state.selected === null ? 'disabled' : ''}>${state.index === questions.length - 1 ? '查看我的自然物 →' : '下一题 →'}</button></div>`;
      questionView.querySelectorAll('.option').forEach(btn => btn.addEventListener('click', () => { state.selected = Number(btn.dataset.option); renderQuestion(); }));
      document.getElementById('back-btn').addEventListener('click', () => { if (state.index > 0) { state.index--; state.selected = state.answers[state.index] ?? null; renderQuestion(); } });
      document.getElementById('next-btn').addEventListener('click', () => { if (state.selected === null) return; state.answers[state.index] = state.selected; if (state.index === questions.length - 1) renderResult(); else { state.index++; state.selected = state.answers[state.index] ?? null; renderQuestion(); } });
    }
    function findCity() {
      const totals = Array(8).fill(0);
      state.answers.forEach((answer, qIndex) => questions[qIndex].options[answer][1].forEach((v, i) => totals[i] += v));
      const average = totals.map(v => v / questions.length);
      const ranked = cities.map(city => { const distance = city.vector.reduce((sum, v, i) => sum + Math.pow(average[i] - v, 2), 0); return { city, score: Math.max(82, Math.min(98, Math.round(98 - distance * 10))) }; }).sort((a, b) => b.score - a.score);
      return ranked[0];
    }
    function findNatural() {
      const totals = Array(8).fill(0);
      state.answers.forEach((answer, qIndex) => questions[qIndex].options[answer][1].forEach((v, i) => totals[i] += v));
      const average = totals.map(v => v / questions.length);
      const ranked = naturalObjects.map(nature => { const distance = nature.vector.reduce((sum, v, i) => sum + Math.pow(average[i] - v, 2), 0); return { nature, score: Math.max(82, Math.min(98, Math.round(98 - distance * 10))) }; }).sort((a, b) => b.score - a.score);
      return ranked[0];
    }
    function renderResult() {
      const natureMatch = findNatural();
      const n = natureMatch.nature;
      const paragraph = `你的本命自然物是${n.name}。${n.essence}，这很像你在日常里的底色。你适合${n.forWho}。当然，${n.downside}——自然物人格不是给你贴标签，而是把你已经拥有的那部分光，轻轻说出来。`;
      resultView.className = 'fade-in';
      resultView.innerHTML = `<article class="result-card" id="share-card"><div class="result-top"><div class="city-stamp">${n.emoji}</div><div><div class="result-label">你的本命自然物是</div><h1 class="result-city">${n.name}</h1><div class="result-country">${n.type}</div><span class="score-chip">自然物匹配度 ${natureMatch.score}%</span></div></div><div class="nature-banner"><div class="nature-emoji">${n.emoji}</div><div><div class="nature-label">你的自然物气质</div><div class="nature-name">${n.name}</div><div class="nature-type">${n.type}｜${n.essence}</div></div></div><p class="quote">“${n.essence}，你也可以按照自己的节奏发光。”</p><div class="result-grid"><div class="mini-card"><div class="mini-label">你的亮点</div><div class="mini-value">${n.essence}</div></div><div class="mini-card"><div class="mini-label">适合你</div><div class="mini-value">${n.forWho}</div></div><div class="mini-card"><div class="mini-label">小缺点</div><div class="mini-value">${n.downside}</div></div></div><p class="result-copy">${paragraph}</p><p class="result-note">这是一份基于生活偏好的轻测试，不替代心理诊断。它只是帮你换一个自然的角度，看见自己的生活气质。</p></article><div class="result-actions"><button class="primary-btn" id="copy-btn" type="button">复制结果文案</button><button class="primary-btn" id="save-image-btn" type="button">保存到相册</button><button class="ghost-btn" id="restart-btn" type="button">重新测试</button></div>`;
      document.getElementById('copy-btn').addEventListener('click', () => copyResult(n, natureMatch.score, paragraph));
      document.getElementById('save-image-btn').addEventListener('click', () => saveResultImage(n, natureMatch.score, paragraph));
      document.getElementById('restart-btn').addEventListener('click', restart);
      showScreen(result);
    }
    async function copyResult(nature, score, paragraph) { const text = `我的本命自然物是${nature.name}｜${nature.type}\n自然物匹配度 ${score}%\n\n${paragraph}\n\n#本命自然物 #自然物人格 #生活方式测试`; try { await navigator.clipboard.writeText(text); showToast('结果文案已复制，去小红书发一篇吧 ✨'); } catch { showToast('复制失败，可以长按截图保存结果卡'); } }
    function roundedRect(ctx, x, y, width, height, radius) { ctx.beginPath(); if (ctx.roundRect) { ctx.roundRect(x, y, width, height, radius); } else { ctx.moveTo(x + radius, y); ctx.arcTo(x + width, y, x + width, y + height, radius); ctx.arcTo(x + width, y + height, x, y + height, radius); ctx.arcTo(x, y + height, x, y, radius); ctx.arcTo(x, y, x + width, y, radius); } ctx.closePath(); }
    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 99) { let line = ''; let lines = 0; for (const char of String(text)) { const test = line + char; if (ctx.measureText(test).width > maxWidth && line) { ctx.fillText(line, x, y); y += lineHeight; lines++; line = char; if (lines >= maxLines - 1) { line += '…'; break; } } else { line = test; } } if (line && lines < maxLines) { ctx.fillText(line, x, y); y += lineHeight; lines++; } return y; }
    function drawResultCanvas(nature, score, paragraph) { const canvas = document.createElement('canvas'); canvas.width = 1080; canvas.height = 1440; const ctx = canvas.getContext('2d'); const gradient = ctx.createLinearGradient(0, 0, 1080, 1440); gradient.addColorStop(0, '#dce9df'); gradient.addColorStop(.55, '#f4eee5'); gradient.addColorStop(1, '#e9ddd1'); ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalAlpha = .35; ctx.fillStyle = '#9fb9ad'; ctx.beginPath(); ctx.arc(80, 230, 170, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#e1a58d'; ctx.beginPath(); ctx.arc(985, 1170, 220, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(255,253,249,.96)'; roundedRect(ctx, 56, 54, 968, 1332, 42); ctx.fill(); ctx.fillStyle = '#56776a'; ctx.font = '700 22px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillText('生活方式研究所', 100, 120); ctx.fillStyle = '#9aa79e'; ctx.font = '700 18px system-ui, sans-serif'; ctx.fillText('NATURE MATCH / 50', 760, 120); ctx.strokeStyle = '#e6e0d6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(100, 156); ctx.lineTo(980, 156); ctx.stroke(); ctx.fillStyle = '#d88770'; ctx.font = '700 22px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillText('你的本命自然物是', 100, 224); ctx.font = '700 82px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#27322f'; ctx.fillText(nature.name, 100, 318); ctx.font = '500 27px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#7e8780'; ctx.fillText(nature.type, 102, 365); ctx.fillStyle = '#e5efe8'; roundedRect(ctx, 100, 402, 240, 54, 27); ctx.fill(); ctx.fillStyle = '#56776a'; ctx.font = '700 22px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillText(`自然物匹配度 ${score}%`, 124, 437); ctx.fillStyle = '#f0ebe3'; roundedRect(ctx, 100, 500, 880, 144, 24); ctx.fill(); ctx.font = '700 21px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#d88770'; ctx.fillText('你的自然物气质', 132, 548); ctx.font = '700 31px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#27322f'; ctx.fillText(nature.name, 132, 590); ctx.font = '500 22px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#68736c'; wrapCanvasText(ctx, nature.essence, 300, 588, 640, 32, 2); ctx.fillStyle = '#39443f'; ctx.font = '600 30px "PingFang SC", "Microsoft YaHei", sans-serif'; let y = wrapCanvasText(ctx, `“${nature.essence}，你也可以按照自己的节奏发光。”`, 100, 724, 880, 48, 3); y += 26; ctx.fillStyle = '#7e8780'; ctx.font = '700 19px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillText('你的亮点', 100, y); ctx.fillText('适合你', 400, y); ctx.fillText('小缺点', 700, y); y += 38; ctx.fillStyle = '#27322f'; ctx.font = '500 21px "PingFang SC", "Microsoft YaHei", sans-serif'; wrapCanvasText(ctx, nature.essence, 100, y, 230, 32, 4); wrapCanvasText(ctx, nature.forWho, 400, y, 230, 32, 4); wrapCanvasText(ctx, nature.downside, 700, y, 230, 32, 4); y += 175; ctx.strokeStyle = '#e6e0d6'; ctx.beginPath(); ctx.moveTo(100, y); ctx.lineTo(980, y); ctx.stroke(); y += 52; ctx.fillStyle = '#68736c'; ctx.font = '500 23px "PingFang SC", "Microsoft YaHei", sans-serif'; wrapCanvasText(ctx, paragraph, 100, y, 880, 38, 8); ctx.fillStyle = '#9a9c91'; ctx.font = '500 18px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.fillText('#本命自然物  #自然物人格  #生活方式测试', 100, 1328); return canvas; }
    async function saveResultImage(nature, score, paragraph) { const canvas = drawResultCanvas(nature, score, paragraph); canvas.toBlob(async blob => { if (!blob) { showToast('图片生成失败，请稍后再试'); return; } const fileName = `本命自然物-${nature.name}.png`; const file = new File([blob], fileName, { type: 'image/png' }); try { if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) { await navigator.share({ title: `我的本命自然物是${nature.name}`, text: '测测你的本命自然物', files: [file] }); showToast('请在分享面板中选择“存储图像”'); } else { const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = fileName; const preview = window.open(url, '_blank'); if (!preview) link.click(); setTimeout(() => URL.revokeObjectURL(url), 1200); showToast('结果图已生成，请长按图片保存到相册'); } } catch (error) { if (error.name !== 'AbortError') showToast('请长按生成的图片，选择保存到相册'); } }, 'image/png'); }
    function showToast(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 2500); }
    function restart() { state.index = 0; state.answers = []; state.selected = null; showScreen(intro); }
    document.getElementById('start-btn').addEventListener('click', () => { state.index = 0; state.answers = []; state.selected = null; showScreen(quiz); renderQuestion(); });
  </script>
