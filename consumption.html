  <script>

    const state={i:0,a:[],s:null};const intro=document.getElementById('intro'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),qv=document.getElementById('question-view'),rv=document.getElementById('result-view'),toast=document.getElementById('toast');

    function render(){const q=qs[state.i],p=Math.round((state.i+1)/qs.length*100);document.getElementById('progress-label').textContent=`第 ${state.i+1} / ${qs.length} 题`;document.getElementById('progress-percent').textContent=`${p}%`;document.getElementById('fill').style.width=`${p}%`;qv.className='fade';qv.innerHTML=`<div class="kicker">QUESTION ${String(state.i+1).padStart(2,'0')}</div><h2 class="question">${q[0]}</h2><p class="note">${q[1]}</p><div class="options" role="radiogroup">${q[2].map((o,n)=>`<button type="button" class="option ${state.s===n?'selected':''}" data-n="${n}" role="radio" aria-checked="${state.s===n}"><span class="mark">✓</span><span class="option-text">${o[0]}</span></button>`).join('')}</div><div class="footer"><button class="back" id="back" type="button" ${state.i===0?'style="visibility:hidden"':''}>← 上一题</button><button class="primary" id="next" type="button" ${state.s===null?'disabled':''}>${state.i===qs.length-1?'查看我的消费风格 →':'下一题 →'}</button></div>`;qv.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.s=Number(b.dataset.n);render()});document.getElementById('back').onclick=()=>{if(state.i){state.i--;state.s=state.a[state.i]??null;render()}};document.getElementById('next').onclick=()=>{if(state.s===null)return;state.a[state.i]=state.s;if(state.i===qs.length-1)showResult();else{state.i++;state.s=state.a[state.i]??null;render()}}}
    function match(){const score={practical:0,quality:0,mood:0,budget:0,social:0,outdoors:0,minimal:0,novelty:0};state.a.forEach((n,i)=>qs[i][2][n][1].forEach(k=>score[k]++));const ranked=Object.entries(score).sort((a,b)=>b[1]-a[1]);return{type:types[ranked[0][0]],score:Math.round(78+ranked[0][1]/qs.length*20)}}
    function showResult(){const m=match(),t=m.type;rv.className='fade';rv.innerHTML=`<article class="card" id="share-card"><div class="result-head"><div class="icon">${t.emoji}</div><div><div class="label">你的生活消费风格是</div><h1 class="name">${t.name}</h1><div class="tag">${t.tag}</div><span class="score">生活匹配度 ${m.score}%</span></div></div><p class="quote">“${t.quote}”</p><div class="section">适合你的消费方向</div><div class="box">${t.buy}</div><div class="section">容易踩到的消费坑</div><div class="box">${t.avoid}</div><div class="section">未来 7 天的小行动</div><div class="product-box">${t.action}</div><div class="paywall"><b>解锁你的完整消费报告</b><p>包含预算分配、适合你的商品类型、平价版与品质版清单。当前先保存结果卡，后续可以接入付费报告和精选商品。</p><button class="secondary" id="paid" type="button">查看完整报告内容</button></div><p class="footnote">这是一份基于生活偏好的轻测试，不构成财务建议。它只是帮你更清楚地看见自己的购买习惯。</p></article><div class="actions"><button class="primary" id="copy" type="button">复制结果文案</button><button class="primary" id="save" type="button">保存结果图</button><button class="secondary" id="again" type="button">重新测试</button></div>`;document.getElementById('copy').onclick=()=>copy(t,m.score);document.getElementById('save').onclick=()=>save(t,m.score);document.getElementById('again').onclick=()=>{state.i=0;state.a=[];state.s=null;screen(intro)};document.getElementById('paid').onclick=()=>toastMsg('完整报告入口可以接入小红书店铺或你的支付链接');screen(result)}
    async function copy(t,score){const text=`我的生活消费风格是「${t.name}」｜${t.tag}\n生活匹配度 ${score}%\n\n${t.quote}\n\n适合我的消费方向：${t.buy}\n未来 7 天的小行动：${t.action}\n\n#生活消费风格 #生活方式测试 #理性消费`;try{await navigator.clipboard.writeText(text);toastMsg('结果文案已复制 ✨')}catch{toastMsg('复制失败，可以直接截图保存')}}
    function canvas(t,score){const c=document.createElement('canvas');c.width=1080;c.height=1320;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,1080,1320);g.addColorStop(0,t.colors[0]);g.addColorStop(1,t.colors[1]);x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='rgba(255,253,249,.96)';x.beginPath();x.roundRect(55,55,970,1210,42);x.fill();x.fillStyle='#5d806f';x.font='700 22px "PingFang SC","Microsoft YaHei"';x.fillText('生活方式研究所',100,120);x.fillStyle='#d97962';x.font='700 22px "PingFang SC","Microsoft YaHei"';x.fillText('你的生活消费风格是',100,230);x.fillStyle='#2f3935';x.font='700 68px "PingFang SC","Microsoft YaHei"';x.fillText(t.name,100,330);x.fillStyle='#7d8982';x.font='500 26px "PingFang SC","Microsoft YaHei"';x.fillText(t.tag,102,378);x.fillStyle='#e5efe8';x.beginPath();x.roundRect(100,415,220,52,26);x.fill();x.fillStyle='#5d806f';x.font='700 20px "PingFang SC","Microsoft YaHei"';x.fillText(`生活匹配度 ${score}%`,123,448);x.fillStyle='#3b4841';x.font='600 30px "PingFang SC","Microsoft YaHei"';x.fillText(`“${t.quote}”`,100,555);x.fillStyle='#d97962';x.font='700 20px "PingFang SC","Microsoft YaHei"';x.fillText('适合你的消费方向',100,690);x.fillStyle='#53655a';x.font='500 24px "PingFang SC","Microsoft YaHei"';x.fillText(t.buy.slice(0,35),100,740);x.fillText(t.buy.slice(35,70),100,780);x.fillStyle='#d97962';x.font='700 20px "PingFang SC","Microsoft YaHei"';x.fillText('未来 7 天的小行动',100,900);x.fillStyle='#855d4e';x.font='500 24px "PingFang SC","Microsoft YaHei"';x.fillText(t.action.slice(0,38),100,950);x.fillText(t.action.slice(38,76),100,990);x.fillStyle='#9a9c91';x.font='500 18px "PingFang SC","Microsoft YaHei"';x.fillText('#生活消费风格  #生活方式测试',100,1195);return c}
    function save(t,score){canvas(t,score).toBlob(async b=>{const f=new File([b],`生活消费风格-${t.name}.png`,{type:'image/png'});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({title:`我的生活消费风格是${t.name}`,files:[f]});toastMsg('请在分享面板中选择“存储图像”')}else{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=f.name;const p=window.open(u,'_blank');if(!p)a.click();setTimeout(()=>URL.revokeObjectURL(u),1200);toastMsg('结果图已生成，请长按图片保存')}}catch(e){if(e.name!=='AbortError')toastMsg('请长按生成的图片保存')}} ,'image/png')}
    function toastMsg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>toast.classList.remove('show'),2600)}document.getElementById('start').onclick=()=>{state.i=0;state.a=[];state.s=null;screen(quiz);render()};
  </script>
